<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pathfinding Applet</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/p5.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/addons/p5.sound.min.js"></script>
  <link rel="stylesheet" type="text/css" href="applets_styling.css">
</head>
<body>
  <div id="allContent">
    <h1 id="mainTitle">Pathfinding Grid</h1>
  </div>

  <!-- Top buttons -->
  <div class="top-buttons">
    <button onclick="window.location.href='../index.html'">Home</button>
    <button onclick="window.location.href='../appletsPage.html'">Applets</button>
    <button onclick="window.location.href='../projectsPage.html'">Projects</button>
  </div>

  <!-- Bottom controls -->
  <div class="bottom-controls">

    <!-- Left side: dropdowns -->
    <div class="controls-left">
      <div class="filter-controls">
        <label for="gridModeDropdown">Grid Mode</label>
        <select id="gridModeDropdown" class="dropdown">
          <option>Rectangles</option>
          <option>Empty</option>
          <option>Custom</option>
          <option>Circle</option>
          <option>L-Shapes</option>
          <option>Random</option>
        </select>

        <label for="algorithmDropdown">Algorithm</label>
        <select id="algorithmDropdown" class="dropdown">
          <option>A*</option>
          <option>Dijkstra</option>
          <option>Depth-First</option>
          <option>Breadth-First</option>
        </select>
      </div>
    </div>

    <!-- Right side: new controls -->
    <div class="controls-right">
      <button id="calculateBtn">Calculate</button>

      <div class="filter-controls">
        <label for="gridNumber">Grids</label>
        <input type="number" id="gridNumber" value="20" min="5" max="100">
      </div>

<div class="filter-controls">
  <label class="toggle-switch">
    <input type="checkbox" id="obstacleDensity" data-on="Sparse" data-off="Dense">
    <span class="labels" data-on="Sparse" data-off="Dense"></span>
  </label>
</div>

      
    </div>

  </div>

  <!-- Put JS AFTER all DOM elements -->
  <script src="path_finding.js"></script>
</body>
</html>
