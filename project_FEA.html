<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <title>Dadmehr Ghasemfar - Portfolio</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <link rel="stylesheet" type="text/css" href="style.css" />
    
    <style>
        #allContent {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: absolute;
            width: 100%;
        }

        #mainTitle {
            font-size: 5vw;
            border: 3px solid #000000;
            padding: 5px;
            margin: 10px;
        }

        button {
            font-size: 5vw;
            width: 40%;
            text-align: center;
            border: 3px solid #000000;
            color: #000000;
        }

        #pdfDoc {
            width: 90%;
            height: 80vh;
            border: 3px solid #000000;
        }

        @media only screen and (min-width: 600px) {

            #mainTitle {
                font-size: 3vw;
            }

            button {
                width: auto;
                font-size: 3vw;
            }

            #pdfDoc {
                width: 80%;
                left: 10%;
                height: 110vh;
            }
        }
    </style>
    
</head>

<body>

    <canvas id="backgroundSketch"></canvas>
    <script src="background.js"></script>

    <div id="allContent">
        <h1 id="mainTitle">Wave Propagation Research</h1>

        <div id="pdfDoc">
            <iframe 
                class="pdf-viewer" 
                allow="fullscreen" 
                width="100%" 
                height="100%" 
                frameborder="0" 
                src="https://drive.google.com/file/d/1ovJ4KRBq9ixFYMB9YCJ6t8SNpz221nMb/preview#view=FitH">
            </iframe>
        </div>

        <button id="homeButton" onclick="window.location.href='index.html'">Home Page</button>
        <button id="backButton" onclick="window.location.href='projectsPage.html'">Back</button>
    </div>
    
</body>
</html>
